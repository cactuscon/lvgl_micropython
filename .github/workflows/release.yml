name: Release

on:
  release:
    types: [published]

# This fork releases only its ESP32-S3 hardware profile. Set this repository
# variable to 'true' to opt into upstream's broader release coverage.
jobs:
  macos-rel:
    if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: AButler/upload-release-assets@v5.0
      with:
        files: "build/*"
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-python@v6.1.0
      with:
        python-version: '3.11'
    - name: Install Deps
      run: |
        brew install --force ninja
        brew install --force sdl2
        brew install --force libffi
        git submodule update --init -- lib/pycparser
        git submodule update --init --jobs 4 -- lib/micropython
        git submodule update --init --jobs 4 -- lib/lvgl
    - name: Build macOS port
      run: python3 make.py macOS DISPLAY=sdl_display INDEV=sdl_pointer

  unix-rel:
    if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: AButler/upload-release-assets@v5.0
      with:
        files: "build/*"
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-python@v6.1.0
      with:
        python-version: '3.11'
    - name: Install Deps
      run: |
        git submodule update --init -- lib/pycparser
        git submodule update --init --jobs 4 -- lib/micropython
        git submodule update --init --jobs 4 -- lib/lvgl
        git submodule update --init --jobs 4 -- lib/SDL
        cd lib/SDL
        git checkout release-2.30.2
        cd ../..
    - name: Build Unix port
      run: python3 make.py unix DISPLAY=sdl_display INDEV=sdl_pointer

  esp32-rel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: AButler/upload-release-assets@v5.0
      with:
        files: "build/*"
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-python@v6.1.0
      with:
        python-version: '3.11'
    - name: Install Deps
      run: |
        git submodule update --init --depth 1 -- lib/pycparser
        git submodule update --init --depth 1 --jobs 4 -- lib/micropython
        git submodule update --init --depth 1 --jobs 4 -- lib/lvgl
    - name: Get Build Deps
      run: |
        git submodule update --init --depth 1 --jobs 4 -- lib/esp-idf
        cd lib/esp-idf
        git submodule update --init --depth 1 --jobs 4 -- components/bt/host/nimble/nimble components/esp_wifi components/esptool_py/esptool components/lwip/lwip components/mbedtls/mbedtls components/bt/controller/lib_esp32 components/bt/controller/lib_esp32c3_family
        cd ../..
        export "IDF_PATH=${GITHUB_WORKSPACE}/lib/esp-idf"
        ./lib/esp-idf/install.sh all
    - name: Setup ESP-IDF
      run: |
        export "IDF_PATH=${GITHUB_WORKSPACE}/lib/esp-idf"
        . ./lib/esp-idf/export.sh

    - name: ESP32_GENERIC-SPIRAM-4
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC BOARD_VARIANT=SPIRAM --flash-size=4 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC-SPIRAM-8
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC BOARD_VARIANT=SPIRAM --flash-size=8 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC_S2-SPIRAM-4
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S2 BOARD_VARIANT=SPIRAM --flash-size=4 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC_S3-4
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 --flash-size=4 DISPLAY=rgb_display DISPLAY=st7796 DISPLAY=st7789 DISPLAY=st7735 DISPLAY=ili9488 DISPLAY=ili9486 DISPLAY=ili9481 DISPLAY=ili9341 DISPLAY=ili9225 DISPLAY=ili9163 DISPLAY=gc9a01 INDEV=xpt2046 INDEV=gt911 INDEV=ft6x36 INDEV=ft6x06 INDEV=ft5x16 INDEV=ft5x06
    - name: ESP32_GENERIC_S3-8
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 --flash-size=8 DISPLAY=rgb_display DISPLAY=st7796 DISPLAY=st7789 DISPLAY=st7735 DISPLAY=ili9488 DISPLAY=ili9486 DISPLAY=ili9481 DISPLAY=ili9341 DISPLAY=ili9225 DISPLAY=ili9163 DISPLAY=gc9a01 INDEV=xpt2046 INDEV=gt911 INDEV=ft6x36 INDEV=ft6x06 INDEV=ft5x16 INDEV=ft5x06
    - name: ESP32_GENERIC_S3-SPIRAM_OCT-8
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT --flash-size=8 DISPLAY=rgb_display DISPLAY=st7796 DISPLAY=st7789 DISPLAY=st7735 DISPLAY=ili9488 DISPLAY=ili9486 DISPLAY=ili9481 DISPLAY=ili9341 DISPLAY=ili9225 DISPLAY=ili9163 DISPLAY=gc9a01 INDEV=xpt2046 INDEV=gt911 INDEV=ft6x36 INDEV=ft6x06 INDEV=ft5x16 INDEV=ft5x06
    - name: ESP32_GENERIC_S3-SPIRAM_OCT-16
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT --flash-size=16 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC_S3-SPIRAM_OCT-16_OCTFLASH
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT --flash-size=16 --octal-flash DISPLAY=rgb_display DISPLAY=st7796 DISPLAY=st7789 DISPLAY=st7735 DISPLAY=ili9488 DISPLAY=ili9486 DISPLAY=ili9481 DISPLAY=ili9341 DISPLAY=ili9225 DISPLAY=ili9163 DISPLAY=gc9a01 INDEV=xpt2046 INDEV=gt911 INDEV=ft6x36 INDEV=ft6x06 INDEV=ft5x16 INDEV=ft5x06
    - name: ESP32_GENERIC_S3-SPIRAM_OCT-32_OCTFLASH
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT --flash-size=32 --octal-flash DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC_P4-4
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_P4 --flash-size=4 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
    - name: ESP32_GENERIC_P4-8
      if: ${{ vars.ENABLE_NON_S3_RELEASE_BUILDS == 'true' }}
      run: python3 make.py esp32 BOARD=ESP32_GENERIC_P4 --flash-size=8 DISPLAY=all INDEV=all EXPANDER=all --ccache --no-scrub
